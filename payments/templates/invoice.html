<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            direction: rtl;
            padding: 30px;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: auto;
            border: 1px solid #ddd;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            border-bottom: 2px solid #ddd;
            padding-bottom: 15px;
        }

        .info {
            margin: 20px 0;
            line-height: 1.8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #f5f5f5;
        }

        .total {
            margin-top: 25px;
            text-align: left;
            font-size: 22px;
            font-weight: bold;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            color: #777;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>فاتورة شراء</h1>

    <div class="info">
        <strong>رقم الطلب:</strong> {{ order.id }} <br>
        <strong>التاريخ:</strong>
        {{ order.created_at|date:"Y-m-d" }}
    </div>

    <table>
        <thead>
            <tr>
                <th>المنتج</th>
                <th>الكمية</th>
                <th>السعر</th>
                <th>المجموع</th>
            </tr>
        </thead>

        <tbody>
            {% for item in order.items.all %}
            <tr>
                <td>{{ item.product.name }}</td>
                <td>{{ item.quantity }}</td>
                <td>${{ item.price }}</td>
                <td>${{ item.subtotal }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="total">
        المجموع الكلي:
        ${{ order.total_price }}
    </div>

    <div class="footer">
        شكراً لشرائك ❤️
    </div>

</div>

</body>
</html>
